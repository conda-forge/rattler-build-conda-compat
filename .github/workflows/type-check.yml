name: Type Check
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  run_tests:
    runs-on: ubuntu-slim

    steps:
        - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

        - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
          with:
            pixi-version: "latest"
            environments: type-checking

        - name: type check
          run: |
            pixi run type-check
