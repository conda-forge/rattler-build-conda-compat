context:
  version: 1.2.3

outputs:
  - staging:
      name: libbar-build
    source:
      - url: https://example.com/libbar-${{ version }}.tar.gz
        sha256: 1111111111111111111111111111111111111111111111111111111111111111
    build:
      script: build_libbar.sh

  - package:
      name: libbar
      version: ${{ version }}
    inherit:
      from: libbar-build
      run_exports: false
    build:
      script: install_libbar.sh
    tests:
      - script:
          - test -f $PREFIX/lib/libbar.so
